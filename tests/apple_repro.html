<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple.com Compliance Repro</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f5f5f7;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .product-tile {
            position: relative;
            background: white;
            padding: 40px;
            border-radius: 18px;
            margin-bottom: 20px;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }
        
        /* Reproduction of Apple's Picture Structure */
        .apple-picture-container {
            position: relative; /* Apple often puts relative on the container */
            width: 300px;
            height: 400px;
        }
        
        /* Typical Apple Image Styles */
        img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Video as Image */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 600px;
        }

        /* Overlay text simulation */
        .overlay-text {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Apple.com Repro Case</h1>

    <!-- Case 1: Standard Picture Element -->
    <div class="product-tile">
        <div class="overlay-text">Reference: Picture Element</div>
        <picture class="apple-picture-container" data-lazy>
            <source srcset="https://via.placeholder.com/300x400.png?text=WebP+Image" type="image/webp">
            <img src="https://via.placeholder.com/300x400.png?text=Fallback+Image" alt="Product Image">
        </picture>
    </div>

    <!-- Case 2: Lazy Loaded Image (Simulated) -->
    <div class="product-tile">
        <div class="overlay-text">Reference: Lazy Loaded (wait 2s)</div>
        <picture class="apple-picture-container" id="lazy-container">
            <img id="lazy-img" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Lazy Product" style="width: 300px; height: 400px; background: #eee;">
        </picture>
    </div>

    <!-- Case 3: Video as Image -->
    <div class="product-tile">
        <div class="overlay-text">Reference: Video Loop</div>
        <div class="video-container" data-inline-media>
            <video muted loop playsinline autoplay width="100%">
                <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
            </video>
        </div>
    </div>

</div>

<script>
    // Simulate Apple's lazy loading
    setTimeout(() => {
        const lazyImg = document.getElementById('lazy-img');
        lazyImg.src = "https://via.placeholder.com/300x400.png?text=Lazy+Loaded+Done";
        lazyImg.parentElement.classList.add('loaded');
        lazyImg.setAttribute('data-picture-loaded', 'true');
    }, 2000);
</script>

</body>
</html>
