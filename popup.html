<!DOCTYPE html>
<html>
<head>
    <style>
        body { width: 250px; font-family: sans-serif; padding: 15px; background: #0f172a; color: white; }
        h2 { font-size: 16px; margin-top: 0; color: #3b82f6; }
        .stat { display: flex; justify-content: space-between; margin: 10px 0; font-size: 14px; }
        .dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .live { background: #22c55e; }
        .local { background: #3b82f6; }
    </style>
</head>
<body>
    <h2>Intelligent Cache</h2>
    <p>Monitoring your browsing...</p>
    <div class="stat">
        <span><span class="dot live"></span>Live Content</span>
        <span id="live-count">Active</span>
    </div>
    <div class="stat">
        <span><span class="dot local"></span>Local Cache</span>
        <span id="local-count">Active</span>
    </div>
</body>
</html>
